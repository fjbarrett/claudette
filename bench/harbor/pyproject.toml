[project]
name = "claudette-harbor"
version = "0.1.0"
description = "Harbor adapter: run claudette on Terminal-Bench and other Harbor datasets"
requires-python = ">=3.12"
dependencies = ["harbor>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudette_harbor"]
