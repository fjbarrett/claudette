id: "count-lines-tool"
title: "Add count_lines tool and write a passing test"
category: "coding"
timeoutSec: 240
prompt: |-
  Add a new `count_lines` tool to this repo's tool layer, then prove it works.

  1. In `src/tools.js`, add a `count_lines` entry to `TOOL_DEFS` describing one
     required string parameter `path` (a file path relative to the workspace root).
  2. In the same file, add a `case 'count_lines'` to `executeTool` that resolves
     the path with the existing `guardPath` helper, reads the file, and returns
     the number of lines as a string.
  3. Write `bench/scratch/count-lines-test.js` (create the directory if needed).
     It must import `executeTool` from `../../src/tools.js`, call it with
     `{ path: 'src/tools.js' }` and a context of `{ cwd: '.', workspace: '.' }`,
     throw if the result is not all digits, throw if the value is not greater
     than 100, and otherwise log the count.
  4. Run `node bench/scratch/count-lines-test.js` and make sure it exits 0.

  Match the style of the tools already in the file.
verify:
  - "node --check src/tools.js"
  - "node -e \"import('./src/tools.js').then(m => { const d = m.TOOL_DEFS.map(function (t) { return t.function; }).find(function (f) { return f.name === 'count_lines'; }); if (d == null) throw new Error('no count_lines TOOL_DEF'); const p = d.parameters || {}; const props = p.properties || {}; if (props.path == null || (p.required || []).indexOf('path') === -1) throw new Error('count_lines must declare required string param path'); console.log('TOOL_DEF ok'); })\""
  - "node -e \"import('./src/tools.js').then(async (m) => { const fs = await import('node:fs'); const wc = (p) => { const s = fs.readFileSync(p, 'utf8'); return s.split('\\n').length - (s.endsWith('\\n') ? 1 : 0); }; const run = (p) => m.executeTool('count_lines', { path: p }, { cwd: '.', workspace: '.' }).then((r) => String(r).trim()); const a = await run('package.json'); const b = await run('src/chat.js'); const files = [[a, 'package.json'], [b, 'src/chat.js']]; for (const pair of files) { const v = pair[0]; const p = pair[1]; if (/^\\d+$/.test(v) === false) throw new Error(p + ' did not return a digit count: ' + v); if (Math.abs(Number(v) - wc(p)) > 1) throw new Error(p + ' count ' + v + ' disagrees with file (' + wc(p) + ')'); } if (a === b) throw new Error('identical counts for different files: constant return'); console.log('counts ok: package.json=' + a + ' src/chat.js=' + b); })\""
  - "node bench/scratch/count-lines-test.js"
judgeFocus: "Did the agent add a count_lines TOOL_DEF entry, implement it in executeTool, create a working test file, and run it to exit 0? Penalise for missing the TOOL_DEF, missing the case in executeTool, a test that doesn't actually assert the value, or a test that fails at runtime."
