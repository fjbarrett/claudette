name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Syntax-check every module
        run: npm run lint
      - name: No secrets in repo
        run: |
          ! git ls-files --error-unmatch .env 2>/dev/null && echo ".env not tracked OK" || (echo ".env is tracked!" && exit 1)
          test -z "$(git diff --cached --name-only | grep -E '\.env$')" || (echo "staged .env" && exit 1)

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check every module
        run: npm run lint
      - name: Test
        if: matrix.node != '24.x'
        run: npm test
        env:
          NODE_ENV: test
          CLAUDETTE_UNSAFE_NO_SANDBOX: '1'
      - name: Test with coverage thresholds
        if: matrix.node == '24.x'
        run: npm run coverage
        env:
          NODE_ENV: test
          CLAUDETTE_UNSAFE_NO_SANDBOX: '1'
      - name: Check no dirty tree on main
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code

  bench-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Every bench task parses and validates
        run: node -e "import('./bench/tasks.js').then(m => m.loadTasks()).then(t => console.log(t.length + ' tasks OK'))"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
