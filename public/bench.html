<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark Results — Claudette</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #a855f7;
      --pass: #22c55e;
      --fail: #ef4444;
      --warn: #f59e0b;
      --radius: 6px;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    header h1 { font-size: 15px; color: var(--accent); font-weight: 600; }
    header p { font-size: 12px; color: var(--muted); }
    #refresh-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
    }
    #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .summary-bar span b { color: var(--text); }

    .filters {
      padding: 10px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
    }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: #1a0a2e; }

    main { padding: 20px 28px; max-width: 1200px; }

    .run-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .run-card.expanded { border-color: #3a3a3a; }

    .run-header {
      display: grid;
      grid-template-columns: 28px 1fr auto auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
    }
    .run-header:hover { background: #1e1e1e; }

    .chevron { color: var(--muted); font-size: 10px; transition: transform 0.15s; }
    .expanded .chevron { transform: rotate(90deg); }

    .task-name { font-weight: 600; font-size: 13px; }
    .task-model { color: var(--muted); font-size: 11px; }
    .task-meta { font-size: 11px; color: var(--muted); }

    .score-pill {
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      min-width: 52px;
      text-align: center;
    }
    .score-high { background: #052e16; color: var(--pass); border: 1px solid #14532d; }
    .score-mid  { background: #1c1400; color: var(--warn); border: 1px solid #713f12; }
    .score-low  { background: #1f0606; color: var(--fail); border: 1px solid #7f1d1d; }

    .verify-pills { display: flex; gap: 4px; flex-wrap: wrap; }
    .vpill {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 3px;
      font-weight: 600;
    }
    .vpill.pass { background: #052e16; color: var(--pass); }
    .vpill.fail { background: #1f0606; color: var(--fail); }

    .run-body { padding: 16px; border-top: 1px solid var(--border); }

    .section-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      margin-top: 16px;
    }
    .section-title:first-child { margin-top: 0; }

    .verify-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .verify-table td { padding: 4px 8px; vertical-align: top; }
    .verify-table td:first-child { width: 48px; text-align: center; }
    .verify-table td:nth-child(2) { color: var(--muted); font-size: 11px; word-break: break-all; }
    .verify-table tr.err-row td { padding-top: 0; }
    .err-text {
      font-size: 11px;
      color: var(--fail);
      white-space: pre-wrap;
      word-break: break-all;
      background: #1f0606;
      border-radius: 3px;
      padding: 4px 8px;
      margin: 2px 0 6px 56px;
    }

    .metrics-row {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .metrics-row span b { color: var(--text); }

    .judge-box {
      background: #0f0f1a;
      border: 1px solid #2a2a3a;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 12px;
    }
    .judge-scores { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    .judge-scores span { color: var(--muted); }
    .judge-scores span b { color: var(--text); }
    .judge-summary { color: var(--muted); line-height: 1.5; }
    .judge-fail { color: var(--muted); font-style: italic; }

    pre.workflow {
      background: #111;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
      color: #ccc;
    }

    .diff-stat {
      font-size: 12px;
      color: var(--muted);
      white-space: pre-wrap;
      font-family: var(--mono);
    }

    .empty { padding: 40px 28px; color: var(--muted); font-size: 13px; }

    @media (max-width: 700px) {
      .run-header { grid-template-columns: 20px 1fr auto; }
      .task-meta, .verify-pills { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>◆ Benchmark Results</h1>
    <p id="subtitle">Claudette — gemma4 test harness</p>
    <button id="refresh-btn">↻ Refresh</button>
  </header>

  <div class="summary-bar" id="summary-bar"></div>
  <div class="filters" id="filters"></div>
  <main id="main"><p class="empty">Loading…</p></main>

  <script>
    let allReports = [];
    let activeFilter = 'all';

    async function load() {
      const res = await fetch('/api/bench');
      const data = await res.json();
      allReports = data.reports;
      render();
    }

    function scoreClass(s) {
      if (s == null) return 'score-mid';
      if (s >= 8) return 'score-high';
      if (s >= 5) return 'score-mid';
      return 'score-low';
    }

    function formatScore(s) {
      return s == null ? 'n/a' : String(s);
    }

    function stripAnsi(s) {
      return (s || '').replace(/\x1b\[[0-9;]*m/g, '').replace(/[⠧⠇⠏⠋⠙⠹⠸⠼⠴⠦]/g, '').replace(/\[2K/g, '').replace(/\[1G/g, '');
    }

    function renderSummary(reports) {
      const total = reports.length;
      const avgHard = total ? (reports.reduce((a, r) => a + (r.summary.hardScore || 0), 0) / total).toFixed(1) : 'n/a';
      const passing = reports.filter(r => r.summary.hardScore >= 8).length;
      const tasks = [...new Set(reports.map(r => r.taskId))].length;
      document.getElementById('summary-bar').innerHTML = `
        <span><b>${total}</b> runs</span>
        <span><b>${tasks}</b> tasks</span>
        <span>avg hard score <b>${avgHard}</b></span>
        <span>≥8 <b>${passing}</b> / ${total}</span>
      `;
    }

    function renderFilters(reports) {
      const tasks = ['all', ...new Set(reports.map(r => r.taskId))];
      document.getElementById('filters').innerHTML = tasks.map(t =>
        `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" data-task="${t}">${t}</button>`
      ).join('');
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.task;
          render();
        });
      });
    }

    function render() {
      const reports = activeFilter === 'all'
        ? allReports
        : allReports.filter(r => r.taskId === activeFilter);

      renderSummary(reports);
      renderFilters(allReports);

      if (!reports.length) {
        document.getElementById('main').innerHTML = '<p class="empty">No reports yet. Run <code>npm run bench:gemma</code> to generate some.</p>';
        return;
      }

      document.getElementById('main').innerHTML = reports.map((r, i) => {
        const overall = r.summary.overallScore;
        const hard = r.summary.hardScore;
        const judge = r.summary.judgeScore;
        const verPills = (r.verification || []).map(v =>
          `<span class="vpill ${v.code === 0 ? 'pass' : 'fail'}">${v.code === 0 ? 'PASS' : 'FAIL'}</span>`
        ).join('');
        const ts = r.startedAt ? new Date(r.startedAt).toLocaleString() : '';
        return `
          <div class="run-card" id="card-${i}">
            <div class="run-header" onclick="toggle(${i})">
              <span class="chevron">▶</span>
              <div>
                <div class="task-name">${r.taskId || '?'}</div>
                <div class="task-model">${r.model || '?'} · ${ts}</div>
              </div>
              <div class="verify-pills">${verPills}</div>
              <div class="task-meta">${r.category || ''}</div>
              <div class="score-pill ${scoreClass(hard)}" title="Hard score">${formatScore(hard)}</div>
              <div class="score-pill ${scoreClass(overall)}" title="Overall score">${formatScore(overall)}</div>
            </div>
            <div class="run-body" id="body-${i}" style="display:none">
              ${renderBody(r)}
            </div>
          </div>`;
      }).join('');
    }

    function renderBody(r) {
      const verRows = (r.verification || []).map(v => {
        const hasErr = v.code !== 0 && (v.stderr || v.stdout);
        const errText = (v.stderr || v.stdout || '').trim().slice(0, 600);
        return `
          <tr>
            <td><span class="vpill ${v.code === 0 ? 'pass' : 'fail'}">${v.code === 0 ? 'PASS' : 'FAIL'}</span></td>
            <td><code>${escHtml(v.command)}</code></td>
          </tr>
          ${hasErr ? `<tr class="err-row"><td colspan="2"><div class="err-text">${escHtml(errText)}</div></td></tr>` : ''}
        `;
      }).join('');

      const judgeHtml = r.llmJudgment?.error
        ? `<p class="judge-fail">Judge failed: ${escHtml(r.llmJudgment.error)}</p>`
        : r.llmJudgment?.scores
        ? `<div class="judge-scores">
            ${Object.entries(r.llmJudgment.scores).map(([k,v]) => `<span>${k}: <b>${v}</b></span>`).join('')}
           </div>
           <p class="judge-summary">${escHtml(r.llmJudgment.summary || '')}</p>`
        : `<p class="judge-fail">No judge data</p>`;

      const workflow = stripAnsi(r.workflow?.summary || '').trim().slice(0, 6000);
      const diffStat = (r.git?.diffStat || '').trim();

      return `
        <p class="section-title">Verification</p>
        <table class="verify-table"><tbody>${verRows}</tbody></table>

        <p class="section-title">Metrics</p>
        <div class="metrics-row">
          <span>hard <b>${r.summary.hardScore}</b></span>
          <span>judge <b>${r.summary.judgeScore ?? 'n/a'}</b></span>
          <span>overall <b>${r.summary.overallScore}</b></span>
          <span>files changed <b>${r.hardChecks?.filesChanged ? 'yes' : 'no'}</b></span>
          <span>verify pass rate <b>${r.hardChecks?.verificationPassRate}</b></span>
        </div>

        ${diffStat ? `<p class="section-title">Diff Stat</p><pre class="diff-stat">${escHtml(diffStat)}</pre>` : ''}

        <p class="section-title">Judge</p>
        <div class="judge-box">${judgeHtml}</div>

        <p class="section-title">Workflow</p>
        <pre class="workflow">${escHtml(workflow)}</pre>
      `;
    }

    function toggle(i) {
      const card = document.getElementById(`card-${i}`);
      const body = document.getElementById(`body-${i}`);
      const expanded = body.style.display !== 'none';
      body.style.display = expanded ? 'none' : 'block';
      card.classList.toggle('expanded', !expanded);
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('refresh-btn').addEventListener('click', load);
    load().catch(err => {
      document.getElementById('main').innerHTML = `<p class="empty">Error: ${err.message}</p>`;
    });
  </script>
</body>
</html>
